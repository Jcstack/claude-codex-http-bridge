name: First-run feedback
description: Tell us what worked or blocked you in a small, supervised trial.
title: "[Trial] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the developer preview. Successful first runs are useful feedback too.
        This report will be public. Use a disposable project and describe only synthetic tasks.
        Do not post credentials, account/email identifiers, private paths, prompts, transcripts, config files, or logs.
  - type: input
    id: environment
    attributes:
      label: Platform and versions
      description: OS, Python, Claude Code version, and bridge commit or release. No installation paths or account details.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: How far did you get?
      options:
        - Installed, launched, and completed a small task
        - Launched, but a model or tool step blocked me
        - Installation or startup blocked me
        - I evaluated the docs but did not install
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: What worked, and what blocked you?
      description: Short synthetic examples for startup, /model, local tools, MCP, a status-line plugin, or resume. A public model ID is optional. No prompts or logs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I reviewed this public report and removed credentials, account identifiers, private paths, prompts, transcripts, configuration, and logs.
          required: true
