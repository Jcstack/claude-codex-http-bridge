name: isolated-hud-safety-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jarrodwatts/claude-hud
          ref: b86e1c3e5255880578de4b7cc87dc383228c2a18
          path: external-hud
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the fail-closed experiment to pinned upstream source
        shell: bash
        run: |
          git -C external-hud apply "$GITHUB_WORKSPACE/upstream/patches/claude-hud-v0.15-git-safety.patch"
          git -C external-hud apply "$GITHUB_WORKSPACE/upstream/patches/claude-hud-v0.15-bun-node-fallback.patch"
          git -C external-hud apply "$GITHUB_WORKSPACE/upstream/patches/claude-hud-v0.15-guarded-git-optin.patch"
          git -C external-hud apply "$GITHUB_WORKSPACE/upstream/patches/claude-hud-v0.15-reported-cache.patch"
      - name: Check Node resolution for existing Bun launchers
        run: python tests/probe_hud_node_fallback.py --hud-dir external-hud
      - name: Exercise synthetic bridge status, activity, quota and post-compaction displays
        run: python tests/probe_hud_render.py --hud-dir external-hud
      - name: Verify version-gated Git display and untrusted configuration controls
        run: python tests/probe_hud_guarded_git.py --hud-dir external-hud
      - name: Verify reported cache token fraction without inferred expiry
        run: python tests/probe_hud_cache_display.py --hud-dir external-hud
      - name: Normalize the synthetic positive-control marker path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git -C external-hud apply "$GITHUB_WORKSPACE/upstream/patches/claude-hud-v0.15-windows-fixture.patch"
      - name: Exercise upstream's owned-repository security controls and failed enumeration
        run: python tests/probe_hud_security.py --hud-dir external-hud
      - name: Install the integrity-locked Claude fixture without scripts
        if: runner.os != 'Windows'
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - name: Select the pinned native Claude fixture
        if: runner.os != 'Windows'
        run: python tests/claude_fixture.py
      - name: Exercise the real Claude status line with fake cache reports and the reviewed HUD
        if: runner.os != 'Windows'
        run: python tests/probe_statusline_cache.py --hud-dir external-hud --legacy-env-check
      - name: Honor an inherited legacy opt-out through the real client and HUD
        if: runner.os != 'Windows'
        run: python tests/probe_statusline_cache.py --hud-dir external-hud --legacy-opt-out-check
      - name: Observe tracked cache and synthetic quota shapes through the real client and HUD
        if: runner.os != 'Windows'
        run: python tests/probe_statusline_cache.py --hud-dir external-hud --observe-fields
