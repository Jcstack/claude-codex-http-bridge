name: isolated-nested-agent-observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the integrity-locked client without scripts
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - name: Select the pinned native client
        run: python tests/claude_fixture.py
      - name: Observe nested and root task-stop ownership against a fake model
        run: python tests/probe_nested_task_stop.py --observe-hooks
