name: source-and-install

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capabilities:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only hash-locked capability wheels
        run: >-
          python -m pip --isolated install --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r requirements-capabilities.lock
      - name: Check native protocols, privacy and window policy without accounts
        run: python -m unittest discover -s tests -v
      - name: Measure isolated listener and process identity checks
        run: python tests/bench_process_identity.py --samples 12
      - name: Observe locked MCP SDK transparency with synthetic inputs
        run: python tests/probe_mcp_sdk_transparency.py
      - name: Audit public capability pins against OSV
        if: runner.os == 'Linux'
        run: python tests/audit_capability_lock.py
      - name: Install the integrity-locked Claude fixture without scripts
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - run: python tests/claude_fixture.py
      - name: Exercise real Claude MCP image/PDF/realtime results and another plugin
        run: python tests/probe_native_mcp_client.py
      - name: Verify real native Windows desktop changes in an owned fixture
        if: runner.os == 'Windows'
        run: python tests/live_desktop.py --keyboard
  claude-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the integrity-locked client without install scripts
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - name: Select the pinned native binary without executing the placeholder shim
        run: python tests/claude_fixture.py
      - name: Verify local Claude behavior without a model account
        run: python tests/probe_claude_client.py
      - name: Verify reported cache counters in an isolated status line
        if: runner.os != 'Windows'
        run: python tests/probe_statusline_cache.py
      - name: Verify status-line settings scope in an isolated terminal
        if: runner.os != 'Windows'
        run: python tests/probe_statusline_scope.py --expect-isolated
      - name: Verify project and local status-line precedence
        if: runner.os != 'Windows'
        run: python tests/probe_statusline_scope.py --expect-project-respected
      - name: Verify linked-worktree status-line precedence
        if: runner.os != 'Windows'
        run: python tests/probe_statusline_scope.py --expect-worktree-respected
      - name: Verify composed custom settings with a fake gateway
        run: python tests/probe_composed_settings.py
      - name: Verify composed settings in bare mode with a fake gateway
        run: python tests/probe_composed_settings.py --bare
      - name: Verify picker reload in an isolated terminal
        if: runner.os != 'Windows'
        run: python tests/probe_picker_reload.py
      - name: Verify subagent default, alias and forced model routing
        run: python tests/probe_subagent_models.py
      - name: Check per-model subagent compaction with synthetic usage
        run: python tests/probe_subagent_compaction.py
      - name: Verify per-model effort limits with a synthetic gateway
        run: python tests/probe_effort_limits.py
      - name: Observe per-alias effort capabilities without an account
        run: python tests/probe_effort_capability_sets.py
      - name: Observe synthetic effort-rejection recovery
        run: python tests/probe_effort_rejection.py
      - name: Observe MCP tool-name normalization and permission controls
        run: python tests/probe_mcp_name_collision.py
      - name: Verify experimental pre-client aliases with an isolated real Claude client
        run: python tests/probe_mcp_alias_candidate.py
      - name: Observe dynamic aliases across a deliberately delayed tool-list response
        run: python tests/probe_mcp_alias_candidate.py --diagnose-dynamic-race
      - name: Check a removed alias against a stale model request
        run: python tests/probe_mcp_alias_candidate.py --diagnose-removed-tool
      - name: Discover a changed MCP tool through an exact ToolSearch selector
        run: python tests/probe_dynamic_toolsearch.py --hold-refresh --require-discovery
      - name: Discover a changed MCP tool through a keyword ToolSearch query
        run: python tests/probe_dynamic_toolsearch.py --hold-refresh --natural-query --require-discovery
      - name: Check a fresh client sees the current synthetic tool description
        run: python tests/probe_dynamic_toolsearch.py --description-change --fresh-description
      - name: Observe a changed tool description in a live and resumed synthetic session
        run: python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh --resume-observation
      - name: Test a description change only in a disposable session record
        run: python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh --resume-observation --repair-synthetic-record
      - name: Check tool effects across interrupted Messages streams
        run: python tests/probe_claude_stream_safety.py
  gateway:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test backend handoff and cancellation with race detection
        if: runner.os != 'Windows'
        run: go test -race -timeout 60s ./...
      - name: Compare native and controller process identities
        working-directory: .
        run: python tests/probe_native_identity.py
      - name: Test native Windows ACLs and backend handoff
        if: runner.os == 'Windows'
        run: go test -timeout 60s ./...
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
        env:
          CLAUDE_CODEX_DEBUG_ACL: '1'
      - name: Verify Linux installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python install.py --root "$RUNNER_TEMP/bridge" --bin-dir "$RUNNER_TEMP/bridge-bin"
          python "$RUNNER_TEMP/bridge/bridge_models.py" verify
          python tests/smoke_persistent.py "$RUNNER_TEMP/bridge"
          python tests/smoke_api_contract.py "$RUNNER_TEMP/bridge/bin/cli-proxy-api"
          python tests/probe_proxy_features.py "$RUNNER_TEMP/bridge/bin/cli-proxy-api" --report-only
          python tests/smoke_transport.py "$RUNNER_TEMP/bridge/bin/cli-proxy-api"
          python tests/smoke_model_state.py "$RUNNER_TEMP/bridge/bin/cli-proxy-api"
          "$RUNNER_TEMP/bridge-bin/claude-codex" --help
      - name: Verify native Windows installation and ACLs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLAUDE_CODEX_DEBUG_ACL: '1'
        run: |
          $bridgeRoot = Join-Path $env:RUNNER_TEMP 'claude-codex-bridge'
          python install.py --root $bridgeRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $bridgeRoot 'bridge_models.py') verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_proxy.py $bridgeRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_persistent.py $bridgeRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_api_contract.py (Join-Path $bridgeRoot 'bin/cli-proxy-api.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/probe_proxy_features.py (Join-Path $bridgeRoot 'bin/cli-proxy-api.exe') --report-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_transport.py (Join-Path $bridgeRoot 'bin/cli-proxy-api.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_model_state.py (Join-Path $bridgeRoot 'bin/cli-proxy-api.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bridgeRoot 'bin/claude-codex.cmd') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
