name: claude-error-recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: cli-proxy-api
          - os: ubuntu-latest
            binary: cli-proxy-api
          - os: windows-latest
            binary: cli-proxy-api.exe
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install the integrity-locked native client without credentials
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
          python tests/claude_fixture.py
      - name: Build before and after only the Claude error compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          for patch in 12d97cf-inline-tools-backport 12d97cf-deferred-tools web-search-replay loopback-tls url-citations native-compaction-v2 incomplete-tool-guard effort-downgrade-guard midconversation-effort forwarded-incomplete-stream-candidate codex-stream-observation-candidate; do
            git -C upstream-source apply "../upstream/patches/${patch}.patch"
          done
          cd upstream-source
          go mod verify
          go build -o "../baseline-${{ matrix.binary }}" ./cmd/server
          git apply --check ../upstream/patches/claude-error-compat.patch
          git apply ../upstream/patches/claude-error-compat.patch
          go test -timeout 180s ./sdk/api/handlers/claude
          go build -o "../candidate-${{ matrix.binary }}" ./cmd/server
          cd ../gateway
          go build -o ../bridge-ingress .
          cd ..
          python runtime_bundle.py --proxy "candidate-${{ matrix.binary }}" --ingress bridge-ingress --output recovery-bundle
      - name: Require baseline failure and native recovery after signature-only reasoning
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_claude_stream_safety.py --proxy-binary "baseline-${{ matrix.binary }}" --codex-executor --codex-origin-binary "baseline-${{ matrix.binary }}" --codex-managed-policy --case eof_reasoning_only --require-failure --client-timeout 60 --file-output
          python tests/probe_claude_stream_safety.py --proxy-binary "candidate-${{ matrix.binary }}" --codex-executor --codex-origin-binary "baseline-${{ matrix.binary }}" --codex-managed-policy --case healthy --case eof_reasoning_only --case eof_partial_arguments --case eof_arguments_done --case eof_tool_item_done --require-recovery --client-timeout 90 --file-output
          python tests/probe_claude_stream_safety.py --proxy-binary "candidate-${{ matrix.binary }}" --codex-executor --codex-origin-binary "baseline-${{ matrix.binary }}" --codex-managed-policy --fixture-model gpt-6-astra --fixture-behaves-as claude-opus-5-5 --case eof_reasoning_only --reasoning-delay-seconds 65 --require-recovery --client-timeout 120 --file-output
          python tests/probe_parallel_stream.py "candidate-${{ matrix.binary }}" --two-layer-eof-origin "baseline-${{ matrix.binary }}"
          python tests/probe_managed_stream_policy.py "baseline-${{ matrix.binary }}" "candidate-${{ matrix.binary }}" bridge-ingress --observe --nonstream
      - name: Check interactive Claude recovery in the same owned process
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_opaque_reasoning_ui.py "baseline-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --require-failure
          python tests/probe_opaque_reasoning_ui.py "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --require-recovery
      - name: Preserve a held stream and persistent client through a managed handoff
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_CODEX_STREAM_DIAGNOSTICS=1 python tests/smoke_managed_runtime.py recovery-bundle --claude-client --previous-proxy "baseline-${{ matrix.binary }}"
