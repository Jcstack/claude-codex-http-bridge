name: terra-effort-roundtrip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: cli-proxy-api
          - os: ubuntu-latest
            binary: cli-proxy-api
          - os: windows-latest
            binary: cli-proxy-api.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install the integrity-locked synthetic client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
          python tests/claude_fixture.py
      - name: Build the pinned source and candidate patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          for patch in 12d97cf-inline-tools-backport 12d97cf-deferred-tools web-search-replay loopback-tls url-citations native-compaction-v2 incomplete-tool-guard effort-downgrade-guard midconversation-effort forwarded-incomplete-stream-candidate codex-stream-observation-candidate claude-error-compat codex-http-observation; do
            git -C upstream-source apply "../upstream/patches/${patch}.patch"
          done
          cd upstream-source
          go mod verify
          go build -o "../${{ matrix.binary }}" ./cmd/server
      - name: Check Terra effort and synthetic cache structure
        run: python tests/probe_effort_roundtrip.py "${{ matrix.binary }}" --family terra
