name: isolated-antigravity-lazy-observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ""
          - os: macos-15
            suffix: ""
          - os: windows-latest
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build a control and a separate, unpublished candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          cd upstream-source
          go mod verify
          for patch in 12d97cf-inline-tools-backport.patch 12d97cf-deferred-tools.patch web-search-replay.patch loopback-tls.patch url-citations.patch native-compaction-v2.patch incomplete-tool-guard.patch effort-downgrade-guard.patch midconversation-effort.patch; do
            git apply "../upstream/patches/$patch"
          done
          go build -o "../original${{ matrix.suffix }}" ./cmd/server
          git apply --check ../upstream/patches/antigravity-lazy-candidate.patch
          git apply ../upstream/patches/antigravity-lazy-candidate.patch
          cp ../tests/native_antigravity_lazy_fixture.go internal/misc/bridge_lazy_local_test.go
          go test -timeout 60s -run '^TestBridgeLazyAntigravityVersion$' ./internal/misc
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race -timeout 60s -run '^TestBridgeLazyAntigravityVersion$' ./internal/misc
          fi
          go build -o "../candidate${{ matrix.suffix }}" ./cmd/server
      - name: Observe startup with empty synthetic homes and a blocking local proxy
        shell: bash
        run: python tests/probe_antigravity_lazy.py "original${{ matrix.suffix }}" "candidate${{ matrix.suffix }}" --contract
