name: isolated-usage-environment-gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build the synthetic Windows app-server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\fake-quota-codex.exe" tests/fake_quota_codex.go
          Add-Content -Path $env:GITHUB_ENV -Value "BRIDGE_TEST_FAKE_CODEX_EXE=$env:RUNNER_TEMP\fake-quota-codex.exe" -Encoding utf8
      - name: Check synthetic quota RPC, private helpers and account controls
        env:
          BRIDGE_REQUIRE_QUOTA_TLS_FIXTURE: '1'
        run: python -m unittest tests.test_usage_environment tests.test_model_helper_environment tests.test_launcher_python_environment tests.test_windows_system_tools tests.test_usage_account_identity tests.test_quota_probe_ledger tests.test_macos_quota_handoff tests.test_quota_snapshot_fixture tests.test_quota_memory_fixture tests.test_quota_exec_lock_fixture tests.test_account_transport tests.test_quota_manual_proxy tests.test_cache_observation tests.test_accounts tests.test_quota_recovery tests.test_bridge -v
      - name: Check the synthetic OpenSSL fallback
        if: runner.os == 'macOS'
        env:
          BRIDGE_QUOTA_TLS_GENERATOR: openssl
        run: python -m unittest tests.test_quota_manual_proxy -v
