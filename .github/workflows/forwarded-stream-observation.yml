name: forwarded-stream-observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: cli-proxy-api
          - os: ubuntu-latest
            binary: cli-proxy-api
          - os: windows-latest
            binary: cli-proxy-api.exe
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install the integrity-locked synthetic client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
          python tests/claude_fixture.py
      - name: Check private diagnostics parsing
        run: python -m unittest tests.test_diagnostics tests.test_session_audit -q
      - name: Build independent pinned baseline, fix, and observer candidates
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          for patch in 12d97cf-inline-tools-backport 12d97cf-deferred-tools web-search-replay loopback-tls url-citations native-compaction-v2 incomplete-tool-guard effort-downgrade-guard midconversation-effort; do
            git -C upstream-source apply "../upstream/patches/${patch}.patch"
          done
          cd upstream-source
          go mod verify
          go build -o "../baseline-${{ matrix.binary }}" ./cmd/server
          git apply --check ../upstream/patches/forwarded-incomplete-stream-candidate.patch
          git apply ../upstream/patches/forwarded-incomplete-stream-candidate.patch
          # This changes only three synthetic upstream test servers, not the binary.
          git apply ../tests/upstream_keepalive_fixture.patch
          go test -timeout 180s -run '^(TestBridgeForwardedIncompleteStreamScope|TestCodex)' ./internal/runtime/executor
          go build -o "../fixed-${{ matrix.binary }}" ./cmd/server
          git apply --check ../upstream/patches/codex-stream-observation-candidate.patch
          git apply ../upstream/patches/codex-stream-observation-candidate.patch
          go test -timeout 180s -run '^TestBridgeStreamObservation' ./internal/runtime/executor
          go build -o "../observed-${{ matrix.binary }}" ./cmd/server
      - name: Compare failure classification and preserved quota/auth controls
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_forwarded_incomplete.py "baseline-${{ matrix.binary }}" --expect-old --origin-binary "baseline-${{ matrix.binary }}"
          python tests/probe_forwarded_incomplete.py "fixed-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}"
          python tests/probe_incomplete_cache_handoff.py "baseline-${{ matrix.binary }}" "fixed-${{ matrix.binary }}"
      - name: Check real Claude client against a fake Codex upstream
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_claude_stream_safety.py --proxy-binary "fixed-${{ matrix.binary }}" --codex-executor --forwarded-incomplete --case healthy --case partial_arguments --case failed_partial_arguments --case arguments_done --case tool_item_done --case failed_tool_item_done --client-timeout 45 --file-output
          python tests/probe_claude_stream_safety.py --proxy-binary "fixed-${{ matrix.binary }}" --codex-executor --codex-origin-binary "baseline-${{ matrix.binary }}" --case eof_partial_arguments --case eof_arguments_done --case eof_tool_item_done --client-timeout 45 --file-output
          python tests/probe_parallel_stream.py "fixed-${{ matrix.binary }}" --two-layer-eof-origin "baseline-${{ matrix.binary }}"
          python tests/probe_claude_stream_safety.py --proxy-binary "observed-${{ matrix.binary }}" --codex-observation --forwarded-incomplete --case eof_partial_arguments --case failed_partial_arguments --client-timeout 45 --file-output
