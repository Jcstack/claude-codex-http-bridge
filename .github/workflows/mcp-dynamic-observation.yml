name: isolated-mcp-dynamic-observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the integrity-locked client without scripts
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - name: Select the pinned native client
        run: python tests/claude_fixture.py
      - name: Check alias policy and removed-tool controls
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_mcp_alias_policy tests.test_mcp_definition_audit tests.test_bridge.BridgeTests.test_mcp_definition_dispatch_does_not_start_or_verify_a_service -q
          python tests/probe_mcp_alias_candidate.py
          python tests/probe_mcp_alias_candidate.py --diagnose-dynamic-race
          python tests/probe_mcp_alias_candidate.py --diagnose-removed-tool
      - name: Check synthetic dynamic ToolSearch and description controls
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_dynamic_toolsearch.py --hold-refresh --require-discovery
          python tests/probe_dynamic_toolsearch.py --hold-refresh --natural-query --require-discovery
          python tests/probe_dynamic_toolsearch.py --description-change --fresh-description
          python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh --resume-observation
          python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh --resume-observation --repair-synthetic-record
          python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh --resume-observation --audit-synthetic
          python tests/probe_eager_tool_description.py --fresh-description
          python tests/probe_eager_tool_description.py
          python tests/probe_mcp_schema_change.py --fresh
          python tests/probe_mcp_schema_change.py --resume
          python tests/probe_mcp_schema_change.py --attempt-stale-call
          python tests/probe_mcp_schema_change.py --fresh --guard-schema
          python tests/probe_mcp_schema_change.py --fresh --guard-schema --omit-model-schema
          python tests/probe_mcp_schema_change.py --attempt-stale-call --guard-schema
          python tests/probe_mcp_stream_recovery.py
          python tests/probe_mcp_stream_recovery.py --disconnect
          python tests/probe_mcp_stream_recovery.py --disconnect --request-notification
