name: isolated-statusline-scope-observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the integrity-locked client without scripts
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - name: Select the pinned native client
        run: python tests/claude_fixture.py
      - name: Check source selection on all platforms
        run: python -m unittest discover -s tests -p test_bridge.py
      - name: Reproduce the earlier synthetic source promotion
        run: python tests/probe_statusline_scope.py --expect-promotion
      - name: Check scoped and explicit status lines with the real client
        run: python tests/probe_statusline_scope.py --expect-isolated
      - name: Reproduce the earlier synthetic project and local override
        run: python tests/probe_statusline_scope.py --expect-project-promotion
      - name: Check project and local status-line precedence
        run: python tests/probe_statusline_scope.py --expect-project-respected
      - name: Check linked-worktree local status-line precedence
        run: python tests/probe_statusline_scope.py --expect-worktree-respected
