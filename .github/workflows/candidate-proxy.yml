name: isolated-proxy-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: cli-proxy-api
          - os: ubuntu-latest
            binary: cli-proxy-api
          - os: windows-latest
            binary: cli-proxy-api.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and select the integrity-locked native Claude fixture
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
          python tests/claude_fixture.py
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build a credential-free candidate from pinned source and reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          git -C upstream-source apply ../upstream/patches/12d97cf-inline-tools-backport.patch
          git -C upstream-source apply ../upstream/patches/12d97cf-deferred-tools.patch
          git -C upstream-source apply ../upstream/patches/web-search-replay.patch
          git -C upstream-source apply ../upstream/patches/loopback-tls.patch
          git -C upstream-source apply ../upstream/patches/url-citations.patch
          git -C upstream-source apply ../upstream/patches/native-compaction-v2.patch
          cd upstream-source
          go mod verify
          go build -o "../previous-${{ matrix.binary }}" ./cmd/server
          git apply ../upstream/patches/incomplete-tool-guard.patch
          cp ../tests/translator_incomplete_fixture.go internal/translator/codex/claude/bridge_incomplete_local_test.go
          go test ./internal/translator/codex/claude
          go test ./internal/runtime/executor/helps
          cp ../tests/native_cache_fixture.go internal/runtime/executor/bridge_native_cache_fixture_local_test.go
          cp ../tests/native_incomplete_fixture.go internal/runtime/executor/bridge_incomplete_local_test.go
          # Only the upstream test file changes; production binaries do not include it.
          git apply --check ../tests/upstream_keepalive_fixture.patch
          git apply ../tests/upstream_keepalive_fixture.patch
          go test -timeout 90s -run 'TestCodex|TestBridgeCompact' ./internal/runtime/executor
          cp ../tests/auth_handoff_fixture.go sdk/cliproxy/auth/bridge_handoff_local_test.go
          go test -timeout 60s -run '^TestBridgeAccountHandoff' ./sdk/cliproxy/auth
          go build -o "../unguarded-${{ matrix.binary }}" ./cmd/server
          git apply ../upstream/patches/effort-downgrade-guard.patch
          git apply ../upstream/patches/midconversation-effort.patch
          cp ../tests/effort_guard_fixture.go sdk/api/handlers/bridge_effort_guard_local_test.go
          cp ../tests/midconversation_effort_fixture.go sdk/api/handlers/bridge_mid_effort_local_test.go
          go test -timeout 60s -run '^TestBridge(MarkClaudeRequestedEffort|ProtectClaudeEffortError|MidConversationEffort|MidConversationEffortInvalid)$' ./sdk/api/handlers
          go build -o "../forwarded-baseline-${{ matrix.binary }}" ./cmd/server
          git apply --check ../upstream/patches/forwarded-incomplete-stream-candidate.patch
          git apply ../upstream/patches/forwarded-incomplete-stream-candidate.patch
          go test -timeout 180s -run '^(TestBridgeForwardedIncompleteStreamScope|TestCodex)' ./internal/runtime/executor
          git apply --check ../upstream/patches/codex-stream-observation-candidate.patch
          git apply ../upstream/patches/codex-stream-observation-candidate.patch
          git apply --check ../upstream/patches/claude-error-compat.patch
          git apply ../upstream/patches/claude-error-compat.patch
          git apply --check ../upstream/patches/codex-http-observation.patch
          git apply ../upstream/patches/codex-http-observation.patch
          go test -timeout 180s -run "^TestBridgeHTTPObservation" ./internal/runtime/executor ./internal/runtime/executor/helps
          go test -timeout 180s ./sdk/api/handlers/claude
          go test -timeout 180s -run '^TestBridgeStreamObservation' ./internal/runtime/executor ./internal/runtime/executor/helps
          go build -o "../${{ matrix.binary }}" ./cmd/server
          # This independent system-role candidate is tested but not packed or activated.
          git apply ../upstream/patches/midconversation-system-fidelity.patch
          cp ../tests/scoped_system_fixture.go sdk/api/handlers/bridge_scoped_system_local_test.go
          go test -timeout 60s -run '^TestBridgeScopedSystemValidation$' ./sdk/api/handlers
          go test ./internal/translator/codex/claude
          go build -o "../system-${{ matrix.binary }}" ./cmd/server
          rm sdk/api/handlers/bridge_scoped_system_local_test.go
          git apply --reverse ../upstream/patches/midconversation-system-fidelity.patch
          git apply ../upstream/patches/08437a67-gateway-tool-names.patch
          git apply ../upstream/patches/gateway-instance-identity.patch
          cp ../tests/native_gateway_names_fixture.go internal/translator/codex/claude/bridge_gateway_names_local_test.go
          go test ./internal/translator/codex/claude
          go build -o "../names-${{ matrix.binary }}" ./cmd/server
          cd ../gateway
          go test -timeout 60s ./...
          go build -o ../bridge-ingress .
          if [ "$RUNNER_OS" = "macOS" ]; then
            CGO_ENABLED=0 go build -o ../bridge-ingress-nocgo .
            if ../bridge-ingress-nocgo --check-origin-identity >/dev/null 2>&1; then
              echo "A macOS ingress without native process identity must not be accepted" >&2
              exit 1
            fi
          fi
          cd ..
          python runtime_bundle.py --proxy "${{ matrix.binary }}" --ingress bridge-ingress --output runtime-bundle
          python -c 'import os, pathlib, subprocess; binary = pathlib.Path("runtime-bundle") / ("bridge-ingress.exe" if os.name == "nt" else "bridge-ingress"); subprocess.run([str(binary.resolve()), "--check-origin-identity"], check=True, timeout=10)'
      - name: Check Anthropic-to-Responses contracts without credentials
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_managed_recovery.py runtime-bundle
          python tests/smoke_api_contract.py "${{ matrix.binary }}"
          python tests/probe_incomplete_nonstream.py "${{ matrix.binary }}"
          python tests/probe_incomplete_cache_handoff.py "previous-${{ matrix.binary }}" "${{ matrix.binary }}"
          python tests/probe_incomplete_cache_handoff.py "forwarded-baseline-${{ matrix.binary }}" "${{ matrix.binary }}"
          python tests/probe_forwarded_incomplete.py "forwarded-baseline-${{ matrix.binary }}" --expect-old --origin-binary "forwarded-baseline-${{ matrix.binary }}"
          python tests/probe_forwarded_incomplete.py "${{ matrix.binary }}" --origin-binary "forwarded-baseline-${{ matrix.binary }}"
          python tests/probe_managed_stream_policy.py "forwarded-baseline-${{ matrix.binary }}" "forwarded-baseline-${{ matrix.binary }}" bridge-ingress
          python tests/probe_managed_stream_policy.py "forwarded-baseline-${{ matrix.binary }}" "${{ matrix.binary }}" bridge-ingress
          python tests/probe_managed_stream_policy.py "forwarded-baseline-${{ matrix.binary }}" "${{ matrix.binary }}" bridge-ingress --observe
          python tests/probe_response_resume_route.py "${{ matrix.binary }}"
          python tests/probe_proxy_features.py "${{ matrix.binary }}"
          python tests/probe_toolsearch_cache_batch.py "${{ matrix.binary }}"
          python tests/probe_mcp_alias_gateway.py "${{ matrix.binary }}"
          python tests/probe_dynamic_toolsearch.py --hold-refresh --require-discovery --require-prefix --translator "${{ matrix.binary }}"
          python tests/probe_dynamic_toolsearch.py --hold-refresh --natural-query --require-discovery --require-prefix --translator "${{ matrix.binary }}"
          python tests/probe_dynamic_toolsearch.py --description-change --fresh-description --translator "${{ matrix.binary }}"
          python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh --resume-observation --require-resume-structure --translator "${{ matrix.binary }}"
          python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh --resume-observation --fork-observation --require-fork-structure --translator "${{ matrix.binary }}"
          python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh --resume-observation --repair-synthetic-record --translator "${{ matrix.binary }}"
          python tests/probe_mcp_schema_change.py --fresh --translator "${{ matrix.binary }}"
          python tests/probe_mcp_schema_change.py --resume --translator "${{ matrix.binary }}"
          python tests/probe_effort_roundtrip.py "${{ matrix.binary }}"
          python tests/probe_effort_capability_tui.py "${{ matrix.binary }}"
          python tests/probe_effort_rejection_gateway.py "unguarded-${{ matrix.binary }}" --expect-fallback
          python tests/probe_effort_rejection_gateway.py "${{ matrix.binary }}" --expect-blocked
          python tests/probe_effort_guard_contract.py "${{ matrix.binary }}"
          python tests/probe_midconversation_effort.py "${{ matrix.binary }}" --expect-midconversation
          python tests/probe_midconversation_system.py "${{ matrix.binary }}"
          python tests/probe_midconversation_system.py "system-${{ matrix.binary }}" --expect-fidelity
          python tests/probe_effort_roundtrip.py "${{ matrix.binary }}" --family astra
          python tests/probe_effort_roundtrip.py "${{ matrix.binary }}" --family terra
          python tests/probe_effort_roundtrip.py "${{ matrix.binary }}" --family luna
          python tests/probe_gateway_tool_names.py "names-${{ matrix.binary }}"
          python tests/probe_gateway_tool_names.py "names-${{ matrix.binary }}" --previous "${{ matrix.binary }}"
          python tests/smoke_transport.py "${{ matrix.binary }}"
          python tests/probe_stream_keepalive.py "${{ matrix.binary }}" runtime-bundle
          python tests/probe_settings_handoff.py runtime-bundle
          python tests/probe_claude_stream_safety.py --proxy-binary "${{ matrix.binary }}"
          python tests/probe_claude_stream_safety.py --proxy-binary "${{ matrix.binary }}" --codex-executor --codex-origin-binary "forwarded-baseline-${{ matrix.binary }}" --case eof_partial_arguments --case eof_arguments_done --case eof_tool_item_done --client-timeout 45 --file-output
          python tests/probe_claude_stream_safety.py --proxy-binary "${{ matrix.binary }}" --codex-observation --codex-origin-binary "forwarded-baseline-${{ matrix.binary }}" --codex-managed-policy --case eof_partial_arguments --case eof_tool_item_done --client-timeout 45 --file-output
          python tests/probe_parallel_stream.py "${{ matrix.binary }}"
          python tests/probe_parallel_stream.py "${{ matrix.binary }}" --two-layer-eof-origin "forwarded-baseline-${{ matrix.binary }}"
          if [ "$RUNNER_OS" != "Windows" ]; then
            python tests/probe_parallel_stream.py "${{ matrix.binary }}" --resume-interrupted
          fi
          python tests/smoke_model_state.py "${{ matrix.binary }}"
          python tests/smoke_native_compaction.py "${{ matrix.binary }}"
          python tests/probe_native_compact_progress.py "${{ matrix.binary }}"
          python tests/smoke_web_state.py "${{ matrix.binary }}" --claude-client
          python tests/probe_large_payload_latency.py runtime-bundle
          python tests/probe_catalog_handoff.py runtime-bundle
          python tests/smoke_managed_runtime.py runtime-bundle --claude-client --background-client
          python tests/probe_runtime_rollback.py runtime-bundle --claude-client
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-candidate-${{ matrix.os }}
          path: runtime-bundle/
          retention-days: 1
