name: isolated-cache-resume-observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: cli-proxy-api
          - os: ubuntu-latest
            binary: cli-proxy-api
          - os: windows-latest
            binary: cli-proxy-api.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install the integrity-locked client without scripts
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - name: Select the pinned native client
        run: python tests/claude_fixture.py
      - name: Check structural comparison privacy and negative cases
        run: python -m unittest tests.test_cache_resume_observation -q
      - name: Build the reviewed translator without credentials
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          for patch in 12d97cf-inline-tools-backport 12d97cf-deferred-tools web-search-replay loopback-tls url-citations native-compaction-v2 incomplete-tool-guard effort-downgrade-guard midconversation-effort; do
            git -C upstream-source apply "../upstream/patches/$patch.patch"
          done
          cd upstream-source
          go mod verify
          go build -o "../${{ matrix.binary }}" ./cmd/server
      - name: Observe synthetic cache-diagnostic translation
        run: python tests/probe_cache_diagnostics_route.py --translator ${{ matrix.binary }}
      - name: Observe synthetic cache structure across resume
        run: >-
          python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh
          --resume-observation --require-resume-structure --translator ${{ matrix.binary }}
      - name: Observe synthetic cache structure across fork
        run: >-
          python tests/probe_dynamic_toolsearch.py --description-change --hold-refresh
          --resume-observation --fork-observation --require-fork-structure --translator ${{ matrix.binary }}
