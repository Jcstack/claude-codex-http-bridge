name: isolated-tool-contract-observation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full observation, caller-only candidate, or standalone validator fixture
        type: choice
        required: true
        default: full
        options:
          - full
          - caller
          - validator

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: cli-proxy-api
          - os: ubuntu-latest
            binary: cli-proxy-api
          - os: windows-latest
            binary: cli-proxy-api.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify validator dependency-audit failure handling
        run: python -m unittest tests.test_validator_dependency_audit -q
      - name: Fetch the pinned public JSON Schema test suite
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/bridge-json-schema-suite"
          git -C "$RUNNER_TEMP/bridge-json-schema-suite" remote add origin https://github.com/json-schema-org/JSON-Schema-Test-Suite.git
          git -C "$RUNNER_TEMP/bridge-json-schema-suite" fetch --depth 1 origin 3f05891cac5d51ffa068d7076d1372130e00c829
          git -C "$RUNNER_TEMP/bridge-json-schema-suite" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bridge-json-schema-suite" rev-parse HEAD)" = 3f05891cac5d51ffa068d7076d1372130e00c829
      - name: Exercise the separate synthetic schema-validator fixture
        working-directory: tests/validator-fixture
        shell: bash
        env:
          GOFLAGS: -mod=readonly
          BRIDGE_REQUIRE_NODE: '1'
          BRIDGE_REQUIRE_CONFORMANCE: '1'
          BRIDGE_JSONSCHEMA_SUITE: ${{ runner.temp }}/bridge-json-schema-suite
        run: |
          set -euo pipefail
          go mod download all
          go mod verify
          python audit.py
          go test -v -count=1 -timeout 20s ./...
      - name: Build and test the isolated request-guard candidate
        if: ${{ inputs.scope == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          for patch in 12d97cf-inline-tools-backport 12d97cf-deferred-tools web-search-replay loopback-tls url-citations native-compaction-v2 incomplete-tool-guard effort-downgrade-guard midconversation-effort; do
            git -C upstream-source apply "../upstream/patches/$patch.patch"
          done
          (
            cd upstream-source
            go mod verify
            go build -o "../baseline-${{ matrix.binary }}" ./cmd/server
          )
          git -C upstream-source apply ../upstream/patches/tool-contract-guard-candidate.patch
          cp tests/native_tool_contract_fixture.go upstream-source/internal/runtime/executor/bridge_native_tool_contract_local_test.go
          cp tests/native_toolset_contract_fixture.go upstream-source/internal/translator/codex/claude/bridge_toolset_observation_local_test.go
          cd upstream-source
          go mod verify
          go test ./internal/translator/codex/claude
          go test -timeout 60s -run '^TestCodexBridgeNativeToolContract$' ./internal/runtime/executor
          go build -o "../${{ matrix.binary }}" ./cmd/server
      - name: Observe synthetic streaming and nonstreaming tool contracts
        if: ${{ inputs.scope == 'full' }}
        run: python tests/probe_tool_contract.py --require-preflight-guard --translator ${{ matrix.binary }}
      - name: Verify existing dynamic tool and API contracts
        if: ${{ inputs.scope == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/smoke_api_contract.py "${{ matrix.binary }}"
          python tests/probe_proxy_features.py "${{ matrix.binary }}"
          python tests/probe_toolset_http.py --translator "${{ matrix.binary }}"
      - name: Build and compare the caller-only candidate
        if: ${{ inputs.scope == 'caller' }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          for patch in 12d97cf-inline-tools-backport 12d97cf-deferred-tools web-search-replay loopback-tls url-citations native-compaction-v2 incomplete-tool-guard effort-downgrade-guard midconversation-effort; do
            git -C upstream-source apply "../upstream/patches/$patch.patch"
          done
          cp tests/native_caller_policy_fixture.go upstream-source/internal/runtime/executor/bridge_native_caller_policy_local_test.go
          cp tests/native_toolset_contract_fixture.go upstream-source/internal/translator/codex/claude/bridge_toolset_observation_local_test.go
          cd upstream-source
          go mod verify
          go test -v -run '^TestSyntheticAnthropicClientToolsetsObservation$' ./internal/translator/codex/claude
          go build -o "../baseline-${{ matrix.binary }}" ./cmd/server
          if go test -run '^TestCodexBridgeNativeCallerPolicy$' -timeout 60s ./internal/runtime/executor > "$RUNNER_TEMP/caller-negative.txt" 2>&1; then
            echo 'The baseline unexpectedly enforced the synthetic caller policy.'
            exit 1
          fi
          python -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(); sys.exit(0 if s.count("caller policy was not rejected locally") == 6 and "[build failed]" not in s else 1)' "$RUNNER_TEMP/caller-negative.txt"
          git apply ../upstream/patches/caller-policy-guard-candidate.patch
          go test ./internal/translator/codex/claude
          go test -run '^TestCodexBridgeNativeCallerPolicy$' -timeout 60s ./internal/runtime/executor
          go build -o "../caller-${{ matrix.binary }}" ./cmd/server
          cd ../gateway
          go mod verify
          go build -o "../fixture-ingress-${{ matrix.binary }}" .
      - name: Observe caller-only protocol and cache controls
        if: ${{ inputs.scope == 'caller' }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_tool_contract.py --translator "caller-${{ matrix.binary }}" --require-caller-only-guard
          python tests/smoke_api_contract.py "caller-${{ matrix.binary }}"
          python tests/probe_proxy_features.py "caller-${{ matrix.binary }}"
          python tests/probe_incomplete_cache_handoff.py "baseline-${{ matrix.binary }}" "caller-${{ matrix.binary }}"
          python tests/probe_toolset_http.py --translator "baseline-${{ matrix.binary }}"
          python tests/probe_toolset_http.py --translator "caller-${{ matrix.binary }}"
      - name: Install the integrity-locked synthetic Claude client
        if: ${{ inputs.scope != 'validator' }}
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - name: Locate the locked client
        if: ${{ inputs.scope != 'validator' }}
        run: python tests/claude_fixture.py
      - name: Observe MCP argument delivery and denial with a real client and fake model
        if: ${{ inputs.scope == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_tool_output_client.py
          python tests/probe_tool_output_client.py --translator "${{ matrix.binary }}"
          python tests/probe_tool_output_client.py --translator "${{ matrix.binary }}" --inject-strict
          python tests/probe_tool_output_client.py --translator "baseline-${{ matrix.binary }}" --inject-programmatic-only
          python tests/probe_tool_output_client.py --translator "${{ matrix.binary }}" --inject-programmatic-only --expect-programmatic-rejection
      - name: Observe caller-only behavior with the real client and a fake model
        if: ${{ inputs.scope == 'caller' }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_tool_output_client.py --translator "baseline-${{ matrix.binary }}" --inject-programmatic-only
          python tests/probe_tool_output_client.py --translator "caller-${{ matrix.binary }}" --inject-programmatic-only --expect-programmatic-rejection
          python tests/probe_tool_output_client.py --translator "caller-${{ matrix.binary }}"
          python tests/probe_caller_handoff.py "baseline-${{ matrix.binary }}" "caller-${{ matrix.binary }}" "fixture-ingress-${{ matrix.binary }}" --claude-client
