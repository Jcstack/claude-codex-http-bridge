name: request-phase-observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            binary: cli-proxy-api
          - os: ubuntu-latest
            binary: cli-proxy-api
          - os: windows-latest
            binary: cli-proxy-api.exe
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install the integrity-locked native client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
          python tests/claude_fixture.py
      - name: Build independent previous and observed profiles
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          python - <<'PY'
          import subprocess
          import runtime_bundle
          assert runtime_bundle.PATCHES[-1] == 'codex-http-observation.patch'
          for name in runtime_bundle.PATCHES[:-1]:
              subprocess.run(['git', '-C', 'upstream-source', 'apply', str(runtime_bundle.SOURCE / 'upstream' / 'patches' / name)], check=True)
          PY
          cd upstream-source
          go mod verify
          go build -o "../previous-${{ matrix.binary }}" ./cmd/server
          git apply --check ../upstream/patches/codex-http-observation.patch
          git apply ../upstream/patches/codex-http-observation.patch
          go test -timeout 180s -run '^(TestBridgeHTTPObservation|TestBridgeStreamObservation|TestCodex)' ./internal/runtime/executor ./internal/runtime/executor/helps
          go test -timeout 180s ./sdk/api/handlers/claude
          go build -o "../${{ matrix.binary }}" ./cmd/server
          cd ../gateway
          go build -o ../bridge-ingress .
          cd ..
          python runtime_bundle.py --proxy "${{ matrix.binary }}" --ingress bridge-ingress --output phase-bundle
      - name: Race-check phase timing, cancellation and transport preservation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-source
          go test -race -timeout 180s -run '^(TestBridgeHTTPObservation|TestBridgeStreamObservation|TestCodex)' ./internal/runtime/executor ./internal/runtime/executor/helps
      - name: Check bounded private parsing and incomplete phase coverage
        run: python -m unittest tests.test_http_observation tests.test_diagnostics tests.test_session_audit tests.test_runtime_bundle -q
      - name: Observe actual held headers, held gzip setup and cancellations
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_http_phases.py "${{ matrix.binary }}"
          python tests/probe_http_phases.py "${{ matrix.binary }}" --origin-binary "previous-${{ matrix.binary }}"
      - name: Preserve native recovery through the previous inner credential owner
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_claude_stream_safety.py --proxy-binary "${{ matrix.binary }}" --codex-executor --codex-origin-binary "previous-${{ matrix.binary }}" --codex-managed-policy --case eof_reasoning_only --require-recovery --client-timeout 90 --file-output
          python tests/probe_claude_stream_safety.py --proxy-binary "${{ matrix.binary }}" --codex-executor --codex-origin-binary "previous-${{ matrix.binary }}" --codex-managed-policy --fixture-model gpt-6-astra --fixture-behaves-as claude-opus-5-5 --case eof_reasoning_only --require-recovery --client-timeout 90 --file-output
      - name: Drain an old stream while a persistent client uses the observed backend
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_CODEX_STREAM_DIAGNOSTICS=1 python tests/smoke_managed_runtime.py phase-bundle --claude-client --previous-proxy "previous-${{ matrix.binary }}"
