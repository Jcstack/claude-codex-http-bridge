name: isolated-duplicate-settings-observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the integrity-locked client without scripts
        run: npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
      - name: Select the pinned native client
        run: python tests/claude_fixture.py
      - name: Compare duplicate settings against two fake loopback endpoints
        run: python tests/probe_duplicate_settings.py --expect-redirection
      - name: Validate composition and security unit checks
        run: |
          python -m unittest discover -s tests -p test_bridge.py
          python -m unittest discover -s tests -p test_session_models.py
          python -m unittest discover -s tests -p test_runtime_bundle.py
      - name: Exercise the candidate launcher with two fake gateways and a real client
        run: |
          python tests/probe_composed_settings.py
          python tests/probe_composed_settings.py --bare
      - name: Check nested user hooks and permissions with composed settings
        run: python tests/probe_nested_task_stop.py --expect-ownership-denial --observe-hooks --expect-hook-observation --observe-advisory --expect-advisory --layered-hooks --expect-layered-hooks --expect-layered-permission --compose-extra-settings --expect-extra-settings
      - name: Check duplicate-settings replacement control
        run: python tests/probe_nested_task_stop.py --expect-ownership-denial --observe-advisory --layered-hooks --expect-layered-hooks --expect-layered-permission --extra-settings --expect-extra-replacement
